name: Enable guarded map world launch
on:
  push:
    branches: [dev/bootstrap]
    paths: ['.github/workflows/enable-map-launch.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main/java/io/github/thevynex/earthward/client/EarthwardMapScreen.java')
          s=p.read_text()
          s=s.replace('import io.github.thevynex.earthward.client.map.ProjectedMapModel;', 'import io.github.thevynex.earthward.client.map.ProjectedMapModel;\nimport io.github.thevynex.earthward.client.worldgen.EarthwardWorldCreationLauncher;')
          s=s.replace('private Button earthwardCreateButton;', 'private Button earthwardCreateButton;\n    private boolean spawnSelected;')
          s=s.replace('Component.translatable("earthward.map.create_unavailable"), button -> {})', 'Component.literal("Güvenli konum seç"), button -> {\n                    if (spawnSelected) EarthwardWorldCreationLauncher.start(packageId,\n                            (int)Math.round(selectedX), (int)Math.round(selectedZ));\n                })')
          s=s.replace('super.render(graphics, mouseX, mouseY, partialTick);\n        drawHud(graphics);', 'super.render(graphics, mouseX, mouseY, partialTick);\n        if (earthwardCreateButton != null) {\n            earthwardCreateButton.active = spawnSelected;\n            earthwardCreateButton.setMessage(Component.literal(spawnSelected ? "Earthward dünyasını oluştur" : "Güvenli konum seç"));\n        }\n        drawHud(graphics);')
          s=s.replace('selectedZ = viewport.screenToWorldZ(mouseY, height);\n            return true;', 'selectedZ = viewport.screenToWorldZ(mouseY, height);\n            spawnSelected = true;\n            return true;')
          if 'EarthwardWorldCreationLauncher.start' not in s: raise SystemExit('launcher wiring missing')
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add src/main/java/io/github/thevynex/earthward/client/EarthwardMapScreen.java
          git diff --cached --quiet && exit 1
          git commit -m 'feat(client): enable guarded Earthward launch from map'
          git push origin HEAD:dev/bootstrap
