name: Apply dry bounded terrain correction
on:
  push:
    branches: [dev/bootstrap]
    paths: ['.github/workflows/apply-dry-terrain.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main/java/io/github/thevynex/earthward/worldgen/EarthwardChunkGenerator.java')
          s=p.read_text()
          old='replacement, vanilla.surfaceRule(), vanilla.spawnTarget(), PilotTerrainSampler.SEA_LEVEL_Y,'
          new='replacement, vanilla.surfaceRule(), vanilla.spawnTarget(), PilotTerrainSampler.SEA_LEVEL_Y,'
          s=s.replace('vanilla.noiseSettings(), vanilla.defaultBlock(), vanilla.defaultFluid(),',
                      'vanilla.noiseSettings(), vanilla.defaultBlock(), Blocks.AIR.defaultBlockState(),')
          if 'Blocks.AIR.defaultBlockState()' not in s: raise SystemExit('dry terrain change missing')
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add src/main/java/io/github/thevynex/earthward/worldgen/EarthwardChunkGenerator.java
          git commit -m 'fix(worldgen): prevent vanilla water filling outside pilot terrain'
          git push origin HEAD:dev/bootstrap
