name: Earthward pilot data

on:
  push:
    branches: [dev/bootstrap]
    paths:
      - '.github/workflows/pilot-data.yml'
      - 'tools/prepare_pilot.py'
      - 'tools/test_prepare_pilot.py'
      - 'tools/prepare_elevation.py'
      - 'tools/test_prepare_elevation.py'
      - 'data/pilot_area.json'
      - 'data/BUNDLE_VERSION'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pilot-data.yml'
      - 'tools/prepare_pilot.py'
      - 'tools/test_prepare_pilot.py'
      - 'tools/prepare_elevation.py'
      - 'tools/test_prepare_elevation.py'
      - 'data/pilot_area.json'
      - 'data/BUNDLE_VERSION'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: earthward-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pilot:
    name: Validate and prepare complete pilot package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test bounded data pipelines with synthetic inputs
        run: |
          python3 --version
          python3 -m unittest discover -s tools -p 'test_prepare_pilot.py' -v
          python3 -m unittest discover -s tools -p 'test_prepare_elevation.py' -v
      - name: Fetch one bounded real geometry extract
        if: github.event_name != 'pull_request'
        timeout-minutes: 2
        run: python3 tools/prepare_pilot.py --area data/pilot_area.json --output pilot-output --fetch
      - name: Install pinned raster reader
        if: github.event_name != 'pull_request'
        run: python3 -m pip install --disable-pip-version-check --no-input rasterio==1.4.3
      - name: Fetch and crop one public Copernicus GLO-30 tile
        if: github.event_name != 'pull_request'
        env:
          SOURCE_URL: https://copernicus-dem-30m.s3.eu-central-1.amazonaws.com/Copernicus_DSM_COG_10_N40_00_E029_00_DEM/Copernicus_DSM_COG_10_N40_00_E029_00_DEM.tif
        run: |
          curl --fail --location --silent --show-error --max-time 180 --output source-dem.tif "$SOURCE_URL"
          size=$(stat -c %s source-dem.tif)
          test "$size" -gt 0
          test "$size" -le 134217728
          python3 tools/prepare_elevation.py --area data/pilot_area.json --source source-dem.tif --output elevation-output
      - name: Install checksum-pinned Temurin JDK
        if: github.event_name != 'pull_request'
        run: bash tools/install_jdk.sh
      - name: Setup Gradle
        if: github.event_name != 'pull_request'
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '9.2.1'
          cache-disabled: true
          dependency-graph: disabled
          build-scan-publish: false
      - name: Generate checksum-locked wrapper
        if: github.event_name != 'pull_request'
        run: |
          checksum=$(curl --fail --silent --show-error --location --retry 3 --max-time 90 https://services.gradle.org/distributions/gradle-9.2.1-bin.zip.sha256)
          [[ "$checksum" =~ ^[a-fA-F0-9]{64}$ ]]
          gradle --no-daemon --console=plain --max-workers=2 wrapper \
            --gradle-version 9.2.1 --distribution-type bin \
            --gradle-distribution-sha256-sum "$checksum"
          chmod +x gradlew
      - name: Build and verify matching mod JAR
        if: github.event_name != 'pull_request'
        run: |
          bash tools/ci_build.sh
          python3 tools/check_jar.py
      - name: Stage one-directory test installation
        if: github.event_name != 'pull_request'
        run: |
          package_id=$(python3 -c 'import json; print(json.load(open("data/pilot_area.json"))["package_id"])')
          [[ "$package_id" =~ ^[a-z][a-z0-9_-]{0,63}$ ]]
          mkdir -p "test-bundle/mods" "test-bundle/earthward/packages/$package_id"
          cp build/libs/earthward-0.1.0-dev.1.jar test-bundle/mods/
          cp build/libs/earthward-0.1.0-dev.1.jar.sha256 test-bundle/mods/
          cp -R pilot-output/. "test-bundle/earthward/packages/$package_id/"
          cp -R elevation-output/. "test-bundle/earthward/packages/$package_id/"
          cat > test-bundle/INSTALL.txt <<'EOF'
          EARTHWARD DEVELOPMENT TEST BUNDLE — NOT A RELEASE

          Target: Minecraft Java 1.21.1, NeoForge 21.1.249, Java 21.
          Copy the CONTENTS of this folder into a new, isolated Minecraft game directory.
          The JAR, ODbL OSM geometry, and Copernicus GLO-30 elevation package are placed in their expected paths.

          The mod registers a bounded DEM chunk generator and can plan/apply inferred asphalt and building shells.
          The full-screen picker is present. World creation remains guarded until its launcher, save ownership,
          and real client-load validation are complete. Existing saves must not be used.

          OSM-derived geometry is © OpenStreetMap contributors and ODbL-1.0.
          Copernicus DEM licence/disclaimer applies to elevation files. Read both attribution files.
          EOF
          (
            cd test-bundle
            find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          )
      - name: Upload combined development test bundle
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: earthward-test-bundle-${{ github.sha }}
          path: test-bundle/
          if-no-files-found: error
          retention-days: 7
      - name: Upload separate source-data packages
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: earthward-pilot-data-${{ github.sha }}
          path: |
            pilot-output/
            elevation-output/
          if-no-files-found: error
          retention-days: 7
      - name: Record validation boundary
        if: always()
        run: |
          {
            echo '## Complete pilot package, not a gameplay validation'
            echo 'Synthetic tests run on pull requests; real OSM, Copernicus, build and bundle steps run on dev/bootstrap pushes.'
            echo 'The artifact contains a checked JAR plus separately licensed geometry and elevation in one package directory.'
            echo 'Success does not prove Minecraft client loading, safe spawning, save updates, interiors, NPCs or performance.'
            echo 'No paid service, credentials, runtime game download, horizontal compression, vertical compression or save mutation is used.'
          } >> "$GITHUB_STEP_SUMMARY"
